    <style>
        body {
            background-color: #050510;
            color: #fff;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            height: 100vh;
            font: 14px/1.5 Arial, Helvetica, sans-serif;
            letter-spacing: normal;
        }

        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            margin-top: 72px; /* Offset for nav */
            z-index: 1;
            width: 100%;
            box-sizing: border-box;
        }

        /* Fullscreen mode adjustment */
        body.is-fullscreen .game-container {
            margin-top: 0;
            padding: 0;
        }
        
        body.is-fullscreen nav {
            display: none !important;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            max-height: calc(100vh - 180px); /* Leave room for nav and info */
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 0;
            overflow: hidden;
            border: 1px solid #303038;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.is-fullscreen .game-wrapper {
            max-width: 100vw;
            max-height: none;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            border: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .game-controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 800px;
        }

        .fs-button {
            background: transparent;
            color: #ecebe6;
            border: 1px solid #3a3934;
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            outline: none;
            appearance: none;
            font: inherit;
            min-height: 44px;
        }

        .fs-button:hover {
            background: transparent;
            border-color: #ecebe6;
        }

        .game-info {
            text-align: center;
            color: #bfc3d2;
            padding-bottom: 20px;
            font: inherit;
        }

        .game-info h1 { margin: 0 0 10px; color: #ececee; font-size: 18px; font-weight: 500; }
        .game-info p { margin: 0; }

        .controls-hint {
            margin-top: 10px;
            color: #bfc3d2;
            font: inherit;
        }

        /* Mobile specific portrait adjustment */
        @media screen and (orientation: portrait) and (max-width: 900px) {
            #rotate-prompt {
                display: flex !important;
            }
            .game-container {
                display: none;
            }
            body.is-fullscreen .game-container {
                display: flex;
            }
            body.is-fullscreen #rotate-prompt {
                display: none !important;
            }
        }

        #rotate-prompt {
            position: fixed;
            top: 72px;
            left: 0;
            width: 100%;
            height: calc(100vh - 72px);
            height: calc(100dvh - 72px);
            background: #050510;
            color: #fff;
            display: none;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
            font: 18px/1.6 Arial, Helvetica, sans-serif;
            overflow-y: auto;
        }

        #rotate-prompt p { margin: 0; }
        .rotate-content { margin: auto; flex-shrink: 0; }
        #rotate-prompt .rotate-hint { margin-top: 12px; color: #bfc3d2; font-size: 14px; }
        #portrait-boot-status { max-width: 30rem; margin-top: 20px; font-size: 14px; }
        #portrait-reload {
            appearance: none;
            min-height: 44px;
            margin-top: 12px;
            padding: 8px 16px;
            border: 1px solid #8991a5;
            border-radius: 0;
            background: #14141c;
            color: #fff;
            font: inherit;
            font-size: 14px;
            cursor: pointer;
        }
        #portrait-reload:focus-visible { outline: 1px solid #e8693c; outline-offset: 3px; }
        @media (max-width: 768px) {
            #rotate-prompt { top: 64px; height: calc(100vh - 64px); height: calc(100dvh - 64px); }
        }

        /* Background Nebula Effect */
        #nebula-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
        }
        [hidden] { display: none !important; }
        .fs-button:focus-visible, #lb-overlay button:focus-visible, #lb-name:focus-visible {
            outline: 1px solid #e8693c;
            outline-offset: 4px;
        }
        .fs-button:disabled { cursor: default; opacity: 0.7; }
        .fullscreen-exit {
            position: absolute;
            top: max(80px, calc(env(safe-area-inset-top) + 64px));
            right: max(20px, env(safe-area-inset-right));
            z-index: 10;
            min-width: 44px;
            min-height: 44px;
            padding: 0.6rem 0.8rem;
            border: 1px solid #8991a5;
            border-radius: 0;
            background: #0d0d13;
            color: #fff;
            font: 14px/1.25 Arial, Helvetica, sans-serif;
            cursor: pointer;
            appearance: none;
        }
        .fullscreen-exit:focus-visible { outline: 1px solid #e8693c; outline-offset: 3px; }
        .fullscreen-exit:disabled { cursor: default; opacity: 0.7; }
        .fullscreen-exit-status {
            position: absolute;
            top: calc(max(80px, calc(env(safe-area-inset-top) + 64px)) + 48px);
            right: max(20px, env(safe-area-inset-right));
            z-index: 10;
            max-width: min(24rem, calc(100% - 1rem));
            margin: 0;
            padding: 0.6rem 0.8rem;
            background: #0d0d13;
            color: #e5e8f3;
            font: 14px/1.5 Arial, Helvetica, sans-serif;
        }
        #fullscreen-status {
            max-width: 36rem;
            margin: 0;
            padding: 0.65rem 1rem;
            color: #e5e8f3;
            background: #0d0d13;
            font-size: 14px;
            line-height: 1.5;
        }
        #lb-overlay {
            position: fixed;
            inset: 0;
            z-index: 11000;
            display: flex;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
            background: #050510;
            font: inherit;
        }
        .leaderboard-panel {
            width: min(100%, 440px);
            margin: auto;
            flex-shrink: 0;
            padding: clamp(1rem, 4vw, 30px);
            color: #fff;
            text-align: center;
            background: #0d0d13;
            border: 1px solid #303038;

        #lb-overlay button, #lb-name { appearance: none; border-radius: 0; min-height: 44px; }
        .leaderboard-columns { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; }
        .leaderboard-columns > span { width: auto !important; }
        @media (prefers-reduced-motion: reduce) {
            .game-container, .fs-button { animation: none !important; transition: none !important; }
        }

    <script>
        (() => {
            const status = document.getElementById('portrait-boot-status');
            const reload = document.getElementById('portrait-reload');
            // Register before the iframe can emit a cached-load failure.
            window.addEventListener('message', event => {
                const iframe = document.getElementById('game-iframe');
                if (!iframe || event.source !== iframe.contentWindow || event.origin !== window.location.origin
                    || event.data?.type !== 'ariel-game-boot' || event.data.game !== 'shooter') return;
                const state = event.data.state;
                if (!['waiting', 'failed', 'ready'].includes(state)) return;
                const restoreFocus = state === 'ready' && document.activeElement === reload;
                status.hidden = state === 'ready';
                reload.hidden = state === 'ready';
                status.textContent = state === 'waiting'
                    ? 'The game is taking longer to load. You can wait or reload.'
                    : state === 'failed' ? 'The game could not start. Reload to try again.' : '';
                if (restoreFocus) document.querySelector('.nav-wordmark')?.focus({ preventScroll: true });
            });
            reload.addEventListener('click', () => {
                const iframe = document.getElementById('game-iframe');
                if (!iframe) return;
                status.textContent = 'Loading…';
                iframe.contentWindow.location.reload();
            });
        })();
    </script>

    <script type="module">
        initNav('shooter');

        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const gameWrapper = document.getElementById('game-wrapper');
        const body = document.body;
        const iframe = document.getElementById('game-iframe');
        const fullscreenStatus = document.getElementById('fullscreen-status');
        const fullscreenLabel = document.getElementById('fullscreen-label');
        const fullscreenExit = document.getElementById('fullscreen-exit');
        const fullscreenExitStatus = document.getElementById('fullscreen-exit-status');
        const platHint = document.getElementById('plat-hint');

        if (/Mobi|Android|iPhone/i.test(navigator.userAgent)) {
            platHint.innerText = 'Tap anywhere to move & shoot';
        }

        const fullscreenSupported = typeof gameWrapper.requestFullscreen === 'function'
            && document.fullscreenEnabled !== false;
        const isGameFullscreen = () => document.fullscreenElement === gameWrapper;
        function fullscreenMessage(message) {
            fullscreenStatus.textContent = message;
            fullscreenStatus.hidden = !message;
        }
        if (!fullscreenSupported) {
            fullscreenBtn.disabled = true;
            fullscreenLabel.textContent = 'Fullscreen unavailable';
            fullscreenMessage('Fullscreen is unavailable in this browser. You can play in the window.');
        }
        fullscreenBtn.addEventListener('click', async () => {
            if (!fullscreenSupported || fullscreenBtn.disabled) return;
            fullscreenBtn.disabled = true;
            try {
                if (document.fullscreenElement) {
                    if (typeof document.exitFullscreen !== 'function') throw new Error('Fullscreen cannot be closed.');
                    await document.exitFullscreen();
                } else {
                    await gameWrapper.requestFullscreen();
                }
                fullscreenMessage('');
                iframe.focus({ preventScroll: true });
            } catch (error) {
                body.classList.toggle('is-fullscreen', isGameFullscreen());
                fullscreenMessage('Fullscreen could not open. You can keep playing in the window.');
            } finally {
                fullscreenBtn.disabled = !fullscreenSupported;
            }
        });

        fullscreenExit.addEventListener('click', async () => {
            if (!isGameFullscreen() || fullscreenExit.disabled) return;
            fullscreenExit.disabled = true;
            try {
                if (typeof document.exitFullscreen !== 'function') throw new Error('Fullscreen exit is unavailable.');
                await document.exitFullscreen();
                fullscreenExitStatus.hidden = true;
                iframe.focus({ preventScroll: true });
            } catch (error) {
                fullscreenExitStatus.textContent = 'Could not exit fullscreen. Try your browser’s fullscreen control.';
                fullscreenExitStatus.hidden = false;
            } finally {
                fullscreenExit.disabled = false;
            }
        });

        document.addEventListener('fullscreenchange', () => {
            const active = isGameFullscreen();
            fullscreenExit.hidden = !active;
            if (!active) fullscreenExitStatus.hidden = true;
            body.classList.toggle('is-fullscreen', active);
            fullscreenLabel.textContent = active ? 'Exit fullscreen' : 'Fullscreen';
            if (active && screen.orientation && screen.orientation.lock) {
                try { Promise.resolve(screen.orientation.lock('landscape')).catch(() => {}); } catch (error) {}
            }
            if (!lbOverlay.hidden) syncLeaderboardHost();
        });

        // Starfield respects hidden tabs and reduced-motion settings.
function initBackground() {
    const canvas = document.getElementById('nebula-bg');
    if (!canvas) return;
    let ctx;
    try { ctx = canvas.getContext('2d'); } catch (error) { return; }
    if (!ctx) return;
    const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
    const stars = Array.from({ length: 200 }, () => ({
        x: Math.random(), y: Math.random(), size: Math.random() * 2,
        speed: Math.random() * 0.5 + 0.1
    }));
    let frame = 0;
    let lastTime = 0;
    const draw = (delta = 0) => {
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        stars.forEach(star => {
            ctx.beginPath();
            ctx.arc(star.x * canvas.width, star.y * canvas.height, star.size, 0, Math.PI * 2);
            ctx.fill();
            star.y += star.speed * delta / canvas.height;
            if (star.y > 1) star.y = 0;
        });
    };
    const animate = (timestamp) => {
        frame = 0;
        if (document.hidden || preference.matches) return;
        const delta = lastTime ? Math.min(timestamp - lastTime, 100) / (1000 / 60) : 0;
        lastTime = timestamp;
        draw(delta);
        frame = requestAnimationFrame(animate);
    };
    const sync = () => {
        cancelAnimationFrame(frame);
        frame = 0;
        lastTime = 0;
        if (document.hidden) return;
        draw();
        if (!preference.matches) frame = requestAnimationFrame(animate);
    };
    const resize = () => {
        canvas.width = Math.max(1, window.innerWidth);
        canvas.height = Math.max(1, window.innerHeight);
        sync();
    };
    window.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', sync);
    preference.addEventListener('change', sync);
    resize();
}


        initBackground();

        // ------------------ Leaderboard Injection Logic ------------------ //
        import { submitScore, fetchLeaderboard } from './shooter_leaderboard.js?v=20261008';

        const lbOverlay = document.getElementById('lb-overlay');
        const lbFinalScore = document.getElementById('lb-final-score');
        const lbName = document.getElementById('lb-name');
        const lbSubmit = document.getElementById('lb-submit');
        const lbList = document.getElementById('lb-list');
        const lbClose = document.getElementById('lb-close');
        const lbEntry = document.getElementById('lb-entry');
        const lbStatus = document.getElementById('lb-status');

        let currentScore = 0, scoreSubmitted = false, leaderboardRound = 0, boardRequest = 0;
        let focusBeforeLeaderboard = null;
        const backgroundInert = new Map();

        function setModalBackground(active) {
            backgroundInert.forEach((wasInert, element) => { element.inert = wasInert; });
            backgroundInert.clear();
            if (!active) return;
            let element = lbOverlay;
            while (element.parentElement) {
                const parent = element.parentElement;
                Array.from(parent.children).forEach(sibling => {
                    if (sibling === element || ['SCRIPT', 'STYLE'].includes(sibling.tagName)) return;
                    backgroundInert.set(sibling, sibling.inert);
                    sibling.inert = true;
                });
                if (parent === document.body) break;
                element = parent;
            }
        }

        function syncLeaderboardHost() {
            setModalBackground(false);
            const host = isGameFullscreen() ? gameWrapper : document.body;
            if (lbOverlay.parentElement !== host) host.appendChild(lbOverlay);
            if (!lbOverlay.hidden) setModalBackground(true);
        }

        function closeLeaderboard(restoreFocus = true) {
            // Invalidate every request belonging to the dismissed result.
            leaderboardRound++;
            boardRequest++;
            currentScore = 0;
            scoreSubmitted = false;
            lbOverlay.hidden = true;
            lbOverlay.inert = true;
            setModalBackground(false);
            if (!restoreFocus) return;
            const candidates = [focusBeforeLeaderboard, iframe, fullscreenBtn, document.querySelector('.nav-wordmark')];
            const target = candidates.find(element => element && element !== document.body
                && element.isConnected && !element.disabled && element.getClientRects().length);
            target?.focus({ preventScroll: true });
        }

        function modalControls() {
            return Array.from(lbOverlay.querySelectorAll('input, button, a[href], [tabindex="0"]'))
                .filter(element => !element.disabled && element.getClientRects().length);
        }

        lbOverlay.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                event.preventDefault();
                closeLeaderboard();
            } else if (event.key === 'Tab') {
                const controls = modalControls();
                const first = controls[0], last = controls[controls.length - 1];
                if (!first) { event.preventDefault(); return; }
                if (event.shiftKey && (document.activeElement === first || !lbOverlay.contains(document.activeElement))) {
                    event.preventDefault();
                    last.focus();
                } else if (!event.shiftKey && (document.activeElement === last || !lbOverlay.contains(document.activeElement))) {
                    event.preventDefault();
                    first.focus();
                }
            }
        });

        document.addEventListener('focusin', event => {
            if (!lbOverlay.hidden && !lbOverlay.contains(event.target)) modalControls()[0]?.focus();
        });

        lbName.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                event.preventDefault();
                lbSubmit.click();
            }
        });

        async function showLeaderboard(score) {
            const finalScore = Number(score);
            if (!Number.isFinite(finalScore) || finalScore < 0) return;
            currentScore = finalScore;
            scoreSubmitted = false;
            const round = ++leaderboardRound;
            lbFinalScore.textContent = String(finalScore);
            if (lbOverlay.hidden) focusBeforeLeaderboard = document.activeElement;
            lbOverlay.hidden = false;
            lbOverlay.inert = false;
            syncLeaderboardHost();
            lbEntry.style.display = 'flex';
            lbName.disabled = false;
            lbSubmit.disabled = false;
            lbSubmit.textContent = 'Save';
            lbStatus.textContent = '';
            lbName.focus();

            await refreshLeaderboard(round);
        }

        function boardMessage(message, retry) {
            if (lbOverlay.hidden) return;
            const status = document.createElement('p');
            status.style.textAlign = 'center';
            status.style.color = retry ? '#ff667e' : '#bfc3d2';
            status.style.marginTop = '20px';
            status.setAttribute('role', 'status');
            status.textContent = message;
            lbList.replaceChildren(status);
            if (retry) {
                const button = document.createElement('button');
                button.type = 'button';
                button.textContent = 'Try again';
                button.style.cssText = 'background:#14141c;color:#ececee;border:1px solid #62626d;padding:10px;cursor:pointer;font:inherit;';
                button.addEventListener('click', () => { button.disabled = true; retry(); });
                lbList.appendChild(button);
            }
        }

        async function refreshLeaderboard(round = leaderboardRound) {
            if (lbOverlay.hidden || round !== leaderboardRound) return;
            const request = ++boardRequest;
            boardMessage('Loading scores…');
            try {
                const scores = await fetchLeaderboard(50);
                if (lbOverlay.hidden || round !== leaderboardRound || request !== boardRequest) return;
                lbList.replaceChildren();
                if (scores.length === 0) {
                    boardMessage('No scores yet.');
                } else {
                    scores.forEach((s, idx) => {
                        const r = document.createElement('div');
                        r.style.display = 'grid';
                        r.style.gridTemplateColumns = '24px minmax(0, 1fr) auto';
                        r.style.gap = '8px';
                        r.style.color = idx < 3 ? '#4aff94' : '#fff';
                        r.style.marginBottom = '8px';
                        r.style.fontSize = '14px';

                        const rankStr = (idx + 1).toString().padEnd(3, ' ');
                        const nameStr = String(s.name || 'ANON').substring(0, 6).padEnd(6, ' ');
                        const cells = [
                            [rankStr, 'color:#bfc3d2;'],
                            [nameStr, 'min-width:0;overflow-wrap:anywhere;'],
                            [String(s.score), 'color:#8cafff;max-width:12ch;overflow-wrap:anywhere;text-align:right;'],
                        ];
                        cells.forEach(([text, style]) => {
                            const cell = document.createElement('span');
                            cell.style.cssText = style;
                            cell.textContent = text;
                            r.appendChild(cell);
                        });
                        lbList.appendChild(r);
                    });
                }
            } catch {
                if (lbOverlay.hidden || round !== leaderboardRound || request !== boardRequest) return;
                boardMessage('The leaderboard could not load.', () => refreshLeaderboard(round));
            }
        }

        lbSubmit.addEventListener('click', async () => {
            if (lbOverlay.hidden || lbSubmit.disabled || scoreSubmitted) return;
            const name = lbName.value.trim() || 'ANON';
            const round = leaderboardRound;
            const finalScore = currentScore;
            lbSubmit.textContent = 'Saving…';
            lbSubmit.disabled = true;
            lbName.disabled = true;
            lbStatus.textContent = 'Saving your score…';
            try {
                await submitScore({ name, score: finalScore });
                if (lbOverlay.hidden || round !== leaderboardRound) return;
                scoreSubmitted = true;
                lbSubmit.textContent = 'Saved';
                lbEntry.style.display = 'none';
                lbStatus.textContent = 'Score saved.';
                lbClose.focus();
                await refreshLeaderboard(round);
            } catch {
                if (lbOverlay.hidden || round !== leaderboardRound) return;
                lbStatus.textContent = 'Could not confirm your score was saved. Your name and score are still here. Try again.';
                lbSubmit.textContent = 'Try again';
            } finally {
                if (round === leaderboardRound && !scoreSubmitted) {
                    lbSubmit.disabled = false;
                    lbName.disabled = false;
                }
            }
        });

        lbClose.addEventListener('click', () => closeLeaderboard());
        window.addEventListener('message', event => {
            if (event.source === iframe.contentWindow && event.origin === location.origin
                && event.data?.type === 'ariel-game-start' && event.data.game === 'shooter') {
                closeLeaderboard(false);
            }
        });

        const setupIframe = () => {
            try {
                const iframeWindow = iframe.contentWindow;
                if (!iframeWindow.console._intercepted) {
                    const originalLog = iframeWindow.console.log;
                    iframeWindow.console.log = function (...args) {
                        originalLog.apply(this, args);
                        if (args.length >= 2 && typeof args[0] === 'string' && args[0].includes('Game over! Final score:')) {
                            showLeaderboard(args[1]);
                        }
                    };
                    iframeWindow.console._intercepted = true;
                }
            } catch (e) {}
        };
        iframe.addEventListener('load', setupIframe);
        setupIframe();
    </script>
</body>
</html>
