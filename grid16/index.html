  <!-- Virtual D-Pad -->
  <div id="dpad" class="dpad hidden">
    <div class="dpad-btn dpad-up" data-dir="up"><svg viewBox="0 0 40 40">
        <polygon points="20,8 32,28 8,28" fill="currentColor" />
      </svg></div>
    <div class="dpad-btn dpad-left" data-dir="left"><svg viewBox="0 0 40 40">
        <polygon points="8,20 28,8 28,32" fill="currentColor" />
      </svg></div>
    <div class="dpad-btn dpad-right" data-dir="right"><svg viewBox="0 0 40 40">
        <polygon points="32,20 12,8 12,32" fill="currentColor" />
      </svg></div>
    <div class="dpad-btn dpad-down" data-dir="down"><svg viewBox="0 0 40 40">
        <polygon points="20,32 8,12 32,12" fill="currentColor" />
      </svg></div>
    <div class="dpad-center"></div>
  </div>

  <!-- Title Screen -->
  <div id="title-screen" class="overlay" role="region" aria-labelledby="title-heading">
    <div class="overlay-content">
      <h1 id="title-heading" class="title-text">GRID<span class="accent">16</span></h1>
      <p class="subtitle">SURVIVE THE GRID</p>
      <div class="instructions">
        <div class="instruction-row">Arrow keys / WASD or drag</div>
        <div class="instruction-row">16 games from a pool of 20 &bull; speed increases &bull; survive all</div>
      </div>
      <p id="boot-status" class="instruction-row" role="status" style="margin-bottom:16px">Loading…</p>
      <button id="start-btn" class="neon-btn" disabled>Play</button>
      <button id="board-btn" class="neon-btn secondary" disabled>Scores</button>
      <button id="boot-reload" class="neon-btn secondary" type="button" hidden>Reload</button>
      <noscript>
        <style>#boot-status { display: none !important; }</style>
        <p class="instruction-row">JavaScript is needed to play Grid16. Enable it and reload this page.</p>
      </noscript>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-screen" class="overlay hidden" role="region" aria-labelledby="gameover-heading">
    <div class="overlay-content">
      <h1 id="gameover-heading" class="title-text">COLLAPSE<span class="accent">.</span></h1>
      <div id="final-stats" class="stats-grid"></div>
      <div id="name-entry" class="name-entry">
        <input id="player-name" type="text" maxlength="12" placeholder="ENTER NAME" aria-label="Leaderboard nickname" autocomplete="nickname" autocorrect="off"
          spellcheck="false">
        <button id="submit-btn" class="neon-btn">SUBMIT</button>
      </div>
      <div id="lb-results" class="lb-results hidden"></div>
      <button id="restart-btn" class="neon-btn" style="margin-top:16px">Retry</button>
    </div>
  </div>

  <!-- Leaderboard Screen -->
  <div id="board-screen" class="overlay hidden" role="region" aria-labelledby="board-heading">
    <div class="overlay-content">
      <h1 id="board-heading" class="title-text">TOP <span class="accent">SURVIVORS</span></h1>
      <div id="board-list" class="lb-results"></div>
      <button id="board-close" class="neon-btn" style="margin-top:24px">Back</button>
    </div>
  </div>

  <script>
    (() => {
      const play = document.getElementById('start-btn');
      const scores = document.getElementById('board-btn');
      const canvas = document.getElementById('game-canvas');
      const status = document.getElementById('boot-status');
      const reload = document.getElementById('boot-reload');
      let ready = false;

      window.grid16Boot = {
        ready() {
          if (ready) return;
          ready = true;
          const restoreFocus = document.activeElement === reload;
          play.disabled = false;
          scores.disabled = false;
          canvas.inert = false;
          canvas.tabIndex = 0;
          status.hidden = true;
          reload.hidden = true;
          if (restoreFocus) play.focus({ preventScroll: true });
        },
        fail() {
          if (ready) return;
          status.textContent = 'The game could not start. Reload to try again.';
          status.hidden = false;
          reload.hidden = false;
        }
      };
      reload.addEventListener('click', () => window.location.reload());
      import('./js/main.js?v=20261008').catch(window.grid16Boot.fail);
    })();
  </script>
