<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Space Shooter Roguelike</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0; /* Remove padding for mobile fit */
            font-family: "Press Start 2P", cursive;
            display: flex;
            overflow: hidden;
            box-sizing: border-box;
            touch-action: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Mobile specific portrait adjustment */
        @media screen and (orientation: portrait) and (max-width: 900px) {
            #rotate-prompt {
                display: flex !important;
            }
        }

        #rotate-prompt {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
            padding: 20px;
        }

        #rotate-prompt svg {
            width: 64px;
            height: 64px;
            fill: #4a78ff;
            margin-bottom: 20px;
            animation: rotate 2s infinite ease-in-out;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        #loading {
            color: #fff;
            z-index: 10000;
            background-color: #0f0f1b;
            flex-direction: column;
            align-items: center;
            display: flex;
            position: absolute;
            inset: 0;
            padding: 16px;
            overflow-y: auto;
            overscroll-behavior: contain;
            touch-action: pan-y;
            box-sizing: border-box;
            font: 16px/1.5 Arial, Helvetica, sans-serif;
        }

        .loading-content {
            width: min(100%, 30rem);
            margin: auto;
            flex-shrink: 0;
            text-align: center;
        }

        #loading h1 { margin: 0; font-size: 18px; font-weight: 500; }
        #loading-status { margin: 12px 0; overflow-wrap: anywhere; }
        #reload-game {
            appearance: none;
            min-height: 44px;
            padding: 8px 16px;
            border: 1px solid #8991a5;
            border-radius: 0;
            background: #14141c;
            color: #fff;
            font: inherit;
            font-size: 14px;
            cursor: pointer;
        }
        #reload-game:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
        body.game-loading { touch-action: pan-y; }
        body.game-loading #rotate-prompt { display: none !important; }
        [hidden] { display: none !important; }

        #mute-toggle[role="button"] {
            min-width: 44px;
            min-height: 44px;
            box-sizing: border-box;
            justify-content: center;
        }

        #mute-toggle[role="button"]:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 3px;
        }

        .no-script-message {
            max-width: 30rem;
            padding: 0 1.5rem;
            font: 16px/1.6 Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>

<body class="game-loading">
    <div id="rotate-prompt">
        <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 004 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        <p>Please rotate your device to landscape for the best experience</p>
    </div>

    <div id="game-container">
        <div id="loading">
            <div class="loading-content">
                <h1>Space Shooter</h1>
                <p id="loading-status" role="status">Loading…</p>
                <button id="reload-game" type="button" hidden>Reload</button>
                <noscript>
                    <style>#loading-status, #rotate-prompt { display: none !important; }</style>
                    <p class="no-script-message">JavaScript is needed to play Space Shooter. Enable it in your browser and reload this page.</p>
                </noscript>
            </div>
        </div>
    </div> <audio id="bg-music" src="music.4794c797.mp3" loop autoplay volume="0.25"></audio> <audio id="sfx-hit"
        src="Hit%201.1ca32f45.mp3" preload volume="0.25"></audio> <audio id="sfx-destroy" src="destroy.2d74e718.wav"
        preload volume="0.25"></audio> <audio id="sfx-defeat" src="Game%20Over.53031db2.mp3" preload
        volume="0.25"></audio> <audio id="sfx-upgrade" src="upgrade.b0a32e88.mp3" preload style="display:none"
        volume="0.25"></audio>
    <script>
        (() => {
            const loading = document.getElementById('loading');
            const status = document.getElementById('loading-status');
            const reload = document.getElementById('reload-game');
            const bundleURL = new URL('shooter_game.js', window.location.href);
            let ready = false;
            let failed = false;

            function report(state) {
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'ariel-game-boot', game: 'shooter', state }, window.location.origin);
                }
            }
            function offerReload(state) {
                if (ready || (failed && state === 'waiting')) return;
                failed = state === 'failed';
                status.textContent = failed
                    ? 'The game could not start. Reload to try again.'
                    : 'The game is taking longer to load. You can wait or reload.';
                reload.hidden = false;
                report(state);
            }
            // Elapsed time only offers recovery; the game's own signal confirms success.
            const watchdog = setTimeout(() => offerReload('waiting'), 20000);
            reload.addEventListener('click', () => window.location.reload());
            window.addEventListener('error', event => {
                if (ready) return;
                if (event.target?.id === 'game-bundle' && event.target.tagName === 'SCRIPT') {
                    offerReload('failed');
                } else if (event.filename) {
                    try {
                        const source = new URL(event.filename, window.location.href);
                        if (source.origin === bundleURL.origin && source.pathname === bundleURL.pathname) offerReload('failed');
                    } catch {}
                }
            }, true);
            window.addEventListener('ariel-shooter-ready', () => {
                if (ready) return;
                ready = true;
                clearTimeout(watchdog);
                const restoreFocus = document.activeElement === reload;
                loading.hidden = true;
                document.body.classList.remove('game-loading');
                report('ready');
                if (restoreFocus) queueMicrotask(() => document.getElementById('mute-toggle')?.focus({ preventScroll: true }));
            });
        })();
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", () => { 
            document.querySelectorAll("audio").forEach(e => { e.volume = .25 }); 

            // Attempt to lock orientation if possible
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(err => {
                    console.log("Orientation lock not supported or failed:", err);
                });
            }

            // Click anywhere to full screen and lock if on mobile
            document.addEventListener('click', () => {
                if (document.documentElement.requestFullscreen && /Mobi|Android/i.test(navigator.userAgent)) {
                    // document.documentElement.requestFullscreen(); // Disabled for now to avoid being too intrusive unless user actions trigger it
                }
            }, { once: true });
        });
    </script>
    <script>
        (() => {
            // Release the original bundle's held keys when focus leaves the game.
            const gameKeys = [
                ['ArrowLeft', 'ArrowLeft'], ['KeyA', 'a'],
                ['ArrowRight', 'ArrowRight'], ['KeyD', 'd'], ['Space', ' ']
            ];
            function releaseGameControls() {
                for (const [code, key] of gameKeys) {
                    window.dispatchEvent(new KeyboardEvent('keyup', { code, key, bubbles: true }));
                }
            }
            window.addEventListener('blur', releaseGameControls);
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) releaseGameControls();
            });
            document.addEventListener('focusin', event => {
                if (event.target.closest?.('#mute-toggle')) releaseGameControls();
            });

            // Forward real starts to the host page. Game-over ignores keyup,
            // so release again after the bundle finishes resetting for a retry.
            const originalGameLog = console.log.bind(console);
            console.log = (...args) => {
                originalGameLog(...args);
                if (args[0] === 'Game initialized and started!') window.dispatchEvent(new Event('ariel-shooter-ready'));
                if (args[0] === 'Game started' || args[0] === 'Game restarted') {
                    queueMicrotask(releaseGameControls);
                    if (window.parent !== window) {
                        window.parent.postMessage({ type: 'ariel-game-start', game: 'shooter' }, window.location.origin);
                    }
                }
            };
        })();
    </script>
    <script>
        (() => {
            const enhancedControls = new WeakSet();
            const isActivationKey = event => event.key === 'Enter' || event.key === ' ' || event.code === 'Space';

            function enhanceMuteControl() {
                const control = document.getElementById('mute-toggle');
                if (!control) return;

                control.setAttribute('role', 'button');
                control.tabIndex = 0;
                control.setAttribute('aria-label', control.textContent.trim() || 'Mute game audio');
                if (enhancedControls.has(control)) return;

                enhancedControls.add(control);
                control.addEventListener('keydown', event => {
                    if (!isActivationKey(event)) return;
                    event.preventDefault();
                    event.stopPropagation();
                    if (!event.repeat) control.click();
                });
                control.addEventListener('keyup', event => {
                    if (!isActivationKey(event)) return;
                    event.preventDefault();
                    event.stopPropagation();
                });
            }

            // The bundled game creates this control after loading and changes
            // its text when toggled. Keep its action name in sync with that text.
            const observer = new MutationObserver(enhanceMuteControl);
            observer.observe(document.body, { childList: true, characterData: true, subtree: true });
            enhanceMuteControl();
        })();
    </script>
    <script id="game-bundle" src="shooter_game.js?v=20261002r"></script>
</body>

</html>
